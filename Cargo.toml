[workspace]
members = [".", "packages/tsift-core", "packages/tsift-sqlite", "packages/tsift-libsql", "packages/tsift-tokensave", "packages/tsift-memory", "packages/tsift-md-ast", "packages/tsift-graph", "packages/tsift-algorithms", "packages/tsift-resolution", "packages/tsift-quality", "packages/tsift-index", "packages/tsift-agent-doc", "packages/tsift-session", "packages/tsift-summarize", "packages/tsift-digest", "packages/tsift-search", "packages/tsift-status", "packages/tsift-surrealdb", "packages/tsift-cli", "packages/tsift-sim-world"]
resolver = "3"

[package]
name = "tsift"
version = "0.1.63"
edition = "2024"
description = "Token-efficient CLI plugin for Claude Code — Sift-powered search + native tool routing"
license = "MIT"
repository = "https://github.com/btakita/tsift"
authors = ["Brian Takita <brian.takita@gmail.com>"]
readme = "README.md"
keywords = ["agent", "search", "rag", "cli", "context"]
categories = ["command-line-utilities", "development-tools"]
publish = true

[[bin]]
name = "tsift"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
# Root `tsift` keeps the public package name. Its library remains a thin
# re-export shim while the package binary delegates to `tsift-cli` so
# `cargo install tsift` continues to install the CLI.
tsift-agent-doc = { path = "packages/tsift-agent-doc", version = "0.1.63" }
tsift-algorithms = { path = "packages/tsift-algorithms", version = "0.1.63" }
tsift-cli = { path = "packages/tsift-cli", version = "0.1.63", optional = true }
tsift-digest = { path = "packages/tsift-digest", version = "0.1.63" }
tsift-graph = { path = "packages/tsift-graph", version = "0.1.63" }
tsift-index = { path = "packages/tsift-index", version = "0.1.63" }
tsift-memory = { path = "packages/tsift-memory", version = "0.1.63" }
tsift-quality = { path = "packages/tsift-quality", version = "0.1.63" }
tsift-resolution = { path = "packages/tsift-resolution", version = "0.1.63" }
tsift-search = { path = "packages/tsift-search", version = "0.1.63" }
tsift-sqlite = { path = "packages/tsift-sqlite", version = "0.1.63" }
tsift-status = { path = "packages/tsift-status", version = "0.1.63" }
tsift-summarize = { path = "packages/tsift-summarize", version = "0.1.63" }
tsift-tokensave = { path = "packages/tsift-tokensave", version = "0.1.63" }

tsift-libsql = { path = "packages/tsift-libsql", version = "0.1.63", optional = true }

[features]
default = ["cli", "lang-rust", "lang-python", "lang-typescript", "lang-javascript", "lang-kotlin", "lang-zig", "lang-bash", "lang-markdown"]
backend-libsql = ["dep:tsift-libsql"]
backend-surrealdb = ["cli", "tsift-cli/backend-surrealdb"]
cli = ["dep:tsift-cli"]
lang-rust = ["tsift-graph/lang-rust", "tsift-search/lang-rust"]
lang-python = ["tsift-graph/lang-python", "tsift-search/lang-python"]
lang-typescript = ["tsift-graph/lang-typescript", "tsift-search/lang-typescript"]
lang-javascript = ["tsift-graph/lang-javascript", "tsift-search/lang-javascript"]
lang-kotlin = ["tsift-graph/lang-kotlin", "tsift-search/lang-kotlin"]
lang-zig = ["tsift-graph/lang-zig", "tsift-search/lang-zig"]
lang-bash = ["tsift-graph/lang-bash", "tsift-search/lang-bash"]
lang-markdown = ["tsift-graph/lang-markdown", "tsift-search/lang-markdown"]
all-languages = ["lang-rust", "lang-python", "lang-typescript", "lang-javascript", "lang-kotlin", "lang-zig", "lang-bash", "lang-markdown"]

[dev-dependencies]
