[workspace]
members = [".", "packages/tsift-core", "packages/tsift-sqlite", "packages/tsift-libsql", "packages/tsift-tokensave", "packages/tsift-memory", "packages/tsift-local-model", "packages/tsift-kg", "packages/tsift-memgraphrag", "packages/tsift-md-ast", "packages/tsift-graph", "packages/tsift-algorithms", "packages/tsift-astgrep", "packages/tsift-resolution", "packages/tsift-cache", "packages/tsift-quality", "packages/tsift-index", "packages/tsift-agent-doc", "packages/tsift-session", "packages/tsift-summarize", "packages/tsift-digest", "packages/tsift-search", "packages/tsift-status", "packages/tsift-surrealdb", "packages/tsift-cli", "packages/tsift-sim-world"]
resolver = "3"

[package]
name = "tsift"
version = "0.1.83"
edition = "2024"
description = "Token-efficient CLI plugin for Claude Code — Sift-powered search + native tool routing"
license = "MIT"
repository = "https://github.com/btakita/tsift"
authors = ["Brian Takita <brian.takita@gmail.com>"]
readme = "README.md"
keywords = ["agent", "search", "rag", "cli", "context"]
categories = ["command-line-utilities", "development-tools"]
publish = true

[[bin]]
name = "tsift"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
# Root `tsift` keeps the public package name. Its library remains a thin
# re-export shim while the package binary delegates to `tsift-cli` so
# `cargo install tsift` continues to install the CLI.
tsift-agent-doc = { path = "packages/tsift-agent-doc", version = "0.1.83" }
tsift-algorithms = { path = "packages/tsift-algorithms", version = "0.1.83" }
tsift-astgrep = { path = "packages/tsift-astgrep", version = "0.1.83" }
tsift-cache = { path = "packages/tsift-cache", version = "0.1.83" }
tsift-cli = { path = "packages/tsift-cli", version = "0.1.83", optional = true }
tsift-digest = { path = "packages/tsift-digest", version = "0.1.83" }
tsift-graph = { path = "packages/tsift-graph", version = "0.1.83" }
tsift-index = { path = "packages/tsift-index", version = "0.1.83" }
tsift-kg = { path = "packages/tsift-kg", version = "0.1.83" }
tsift-local-model = { path = "packages/tsift-local-model", version = "0.1.83" }
tsift-memory = { path = "packages/tsift-memory", version = "0.1.83" }
tsift-memgraphrag = { path = "packages/tsift-memgraphrag", version = "0.1.83" }
tsift-quality = { path = "packages/tsift-quality", version = "0.1.83" }
tsift-resolution = { path = "packages/tsift-resolution", version = "0.1.83" }
tsift-search = { path = "packages/tsift-search", version = "0.1.83" }
tsift-sqlite = { path = "packages/tsift-sqlite", version = "0.1.83" }
tsift-status = { path = "packages/tsift-status", version = "0.1.83" }
tsift-summarize = { path = "packages/tsift-summarize", version = "0.1.83" }
tsift-tokensave = { path = "packages/tsift-tokensave", version = "0.1.83" }

tsift-libsql = { path = "packages/tsift-libsql", version = "0.1.83", optional = true }

[features]
default = ["cli", "lang-rust", "lang-python", "lang-typescript", "lang-javascript", "lang-kotlin", "lang-zig", "lang-bash", "lang-go", "lang-gdscript", "lang-markdown"]
backend-libsql = ["dep:tsift-libsql"]
backend-surrealdb = ["cli", "tsift-cli/backend-surrealdb"]
cli = ["dep:tsift-cli"]
lang-rust = ["tsift-astgrep/lang-rust", "tsift-graph/lang-rust", "tsift-search/lang-rust"]
lang-python = ["tsift-astgrep/lang-python", "tsift-graph/lang-python", "tsift-search/lang-python"]
lang-typescript = ["tsift-astgrep/lang-typescript", "tsift-graph/lang-typescript", "tsift-search/lang-typescript"]
lang-javascript = ["tsift-astgrep/lang-javascript", "tsift-graph/lang-javascript", "tsift-search/lang-javascript"]
lang-kotlin = ["tsift-astgrep/lang-kotlin", "tsift-graph/lang-kotlin", "tsift-search/lang-kotlin"]
lang-zig = ["tsift-graph/lang-zig", "tsift-search/lang-zig"]
lang-bash = ["tsift-astgrep/lang-bash", "tsift-graph/lang-bash", "tsift-search/lang-bash"]
lang-go = ["tsift-astgrep/lang-go", "tsift-graph/lang-go", "tsift-search/lang-go"]
lang-gdscript = ["tsift-graph/lang-gdscript", "tsift-search/lang-gdscript"]
lang-markdown = ["tsift-astgrep/lang-markdown", "tsift-graph/lang-markdown", "tsift-search/lang-markdown"]
# Structural-only languages. These fan out to `tsift-astgrep` ONLY: ast-grep can
# match and rewrite them, but `tsift-graph`/`tsift-search` have no tag queries
# for them, so they are not indexable, not searchable, and have no semantic-edit
# executor. Promoting one to a full language means adding the graph/search side
# first. (`lang-zig` and `lang-gdscript` are the mirror image: indexable, but no
# ast-grep grammar.)
lang-c = ["tsift-astgrep/lang-c"]
lang-cpp = ["tsift-astgrep/lang-cpp"]
lang-csharp = ["tsift-astgrep/lang-csharp"]
lang-css = ["tsift-astgrep/lang-css"]
lang-dart = ["tsift-astgrep/lang-dart"]
lang-elixir = ["tsift-astgrep/lang-elixir"]
lang-haskell = ["tsift-astgrep/lang-haskell"]
lang-hcl = ["tsift-astgrep/lang-hcl"]
lang-html = ["tsift-astgrep/lang-html"]
lang-java = ["tsift-astgrep/lang-java"]
lang-json = ["tsift-astgrep/lang-json"]
lang-lua = ["tsift-astgrep/lang-lua"]
lang-nix = ["tsift-astgrep/lang-nix"]
lang-php = ["tsift-astgrep/lang-php"]
lang-ruby = ["tsift-astgrep/lang-ruby"]
lang-scala = ["tsift-astgrep/lang-scala"]
lang-solidity = ["tsift-astgrep/lang-solidity"]
lang-swift = ["tsift-astgrep/lang-swift"]
lang-yaml = ["tsift-astgrep/lang-yaml"]
all-languages = ["lang-rust", "lang-python", "lang-typescript", "lang-javascript", "lang-kotlin", "lang-zig", "lang-bash", "lang-gdscript", "lang-markdown", "lang-c", "lang-cpp", "lang-csharp", "lang-css", "lang-dart", "lang-elixir", "lang-go", "lang-haskell", "lang-hcl", "lang-html", "lang-java", "lang-json", "lang-lua", "lang-nix", "lang-php", "lang-ruby", "lang-scala", "lang-solidity", "lang-swift", "lang-yaml"]

[dev-dependencies]
