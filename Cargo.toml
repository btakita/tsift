[workspace]
members = [".", "packages/tsift-core", "packages/tsift-sqlite", "packages/tsift-libsql", "packages/tsift-tokensave", "packages/tsift-graph", "packages/tsift-algorithms", "packages/tsift-resolution", "packages/tsift-quality", "packages/tsift-index", "packages/tsift-session", "packages/tsift-summarize", "packages/tsift-digest", "packages/tsift-search", "packages/tsift-status", "packages/tsift-cli", "packages/tsift-sim-world"]
resolver = "3"

[package]
name = "tsift"
version = "0.1.62"
edition = "2024"
description = "Token-efficient CLI plugin for Claude Code — Sift-powered search + native tool routing"
license = "MIT"
repository = "https://github.com/btakita/tsift"
authors = ["Brian Takita <brian.takita@gmail.com>"]
readme = "README.md"
keywords = ["agent", "search", "rag", "cli", "context"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# Root `tsift` is now a thin re-export shim: its lib.rs and the `graph` / `lang`
# / `resolution` / `substrate` / `libsql_backend` modules only `pub use` sibling
# crates. It therefore carries no external crate dependencies of its own — every
# real implementation lives in a `tsift-*` workspace crate.
tsift-sqlite = { path = "packages/tsift-sqlite" }
tsift-graph = { path = "packages/tsift-graph" }
tsift-resolution = { path = "packages/tsift-resolution" }
tsift-quality = { path = "packages/tsift-quality" }
tsift-index = { path = "packages/tsift-index" }
tsift-session = { path = "packages/tsift-session" }
tsift-summarize = { path = "packages/tsift-summarize" }
tsift-digest = { path = "packages/tsift-digest" }
tsift-search = { path = "packages/tsift-search" }
tsift-status = { path = "packages/tsift-status" }

tsift-libsql = { path = "packages/tsift-libsql", optional = true }

[features]
default = ["lang-rust", "lang-python", "lang-typescript", "lang-javascript", "lang-kotlin", "lang-zig", "lang-bash", "lang-markdown"]
backend-libsql = ["dep:tsift-libsql"]
lang-rust = ["tsift-graph/lang-rust", "tsift-search/lang-rust"]
lang-python = ["tsift-graph/lang-python", "tsift-search/lang-python"]
lang-typescript = ["tsift-graph/lang-typescript", "tsift-search/lang-typescript"]
lang-javascript = ["tsift-graph/lang-javascript", "tsift-search/lang-javascript"]
lang-kotlin = ["tsift-graph/lang-kotlin", "tsift-search/lang-kotlin"]
lang-zig = ["tsift-graph/lang-zig", "tsift-search/lang-zig"]
lang-bash = ["tsift-graph/lang-bash", "tsift-search/lang-bash"]
lang-markdown = ["tsift-graph/lang-markdown", "tsift-search/lang-markdown"]
all-languages = ["lang-rust", "lang-python", "lang-typescript", "lang-javascript", "lang-kotlin", "lang-zig", "lang-bash", "lang-markdown"]

[dev-dependencies]
