[workspace]
members = [".", "packages/tsift-core", "packages/tsift-sqlite", "packages/tsift-libsql", "packages/tsift-tokensave", "packages/tsift-graph", "packages/tsift-algorithms", "packages/tsift-resolution", "packages/tsift-quality", "packages/tsift-index", "packages/tsift-session", "packages/tsift-cli"]
resolver = "3"

[package]
name = "tsift"
version = "0.1.62"
edition = "2024"
description = "Token-efficient CLI plugin for Claude Code — Sift-powered search + native tool routing"
license = "MIT"
repository = "https://github.com/btakita/tsift"
authors = ["Brian Takita <brian.takita@gmail.com>"]
readme = "README.md"
keywords = ["agent", "search", "rag", "cli", "context"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
fs4 = "0.13"
ignore = "0.4"
rusqlite = { version = "0.34", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
blake3 = "1"
ureq = { version = "3", features = ["json"] }
tagpath = { version = "0.11.1", default-features = false, features = ["lang-rust", "lang-python", "lang-javascript", "lang-typescript"] }
tree-sitter = "0.26"
tsift-core = { path = "packages/tsift-core" }
tsift-sqlite = { path = "packages/tsift-sqlite" }
tsift-graph = { path = "packages/tsift-graph" }
tsift-algorithms = { path = "packages/tsift-algorithms" }
tsift-resolution = { path = "packages/tsift-resolution" }
tsift-quality = { path = "packages/tsift-quality" }
tsift-index = { path = "packages/tsift-index" }
tsift-session = { path = "packages/tsift-session" }
tempfile = "3"

libsql = { version = "0.9", optional = true }
tokio = { version = "1", features = ["rt"], optional = true }
tsift-libsql = { path = "packages/tsift-libsql", optional = true }

[features]
default = ["lang-rust", "lang-python", "lang-typescript", "lang-javascript", "lang-kotlin", "lang-zig", "lang-bash", "lang-markdown"]
backend-libsql = ["dep:tsift-libsql"]
lang-rust = ["tsift-graph/lang-rust"]
lang-python = ["tsift-graph/lang-python"]
lang-typescript = ["tsift-graph/lang-typescript"]
lang-javascript = ["tsift-graph/lang-javascript"]
lang-kotlin = ["tsift-graph/lang-kotlin"]
lang-zig = ["tsift-graph/lang-zig"]
lang-bash = ["tsift-graph/lang-bash"]
lang-markdown = ["tsift-graph/lang-markdown"]
all-languages = ["lang-rust", "lang-python", "lang-typescript", "lang-javascript", "lang-kotlin", "lang-zig", "lang-bash", "lang-markdown"]

[dev-dependencies]
