[package]
name = "tsift"
version = "0.1.0"
edition = "2024"
description = "Token-efficient CLI plugin for Claude Code — Sift-powered search + native tool routing"
license = "MIT"
repository = "https://github.com/btakita/tsift"
authors = ["Brian Takita <brian.takita@gmail.com>"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sift = { git = "https://github.com/rupurt/sift" }
