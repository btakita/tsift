[package]
name = "tsift-digest"
version = "0.1.92"
edition = "2024"
description = "Code-aware digest emitters for tsift — diff / log / metric / test digests with shared summary-cache enrichment"
license = "MIT"
repository = "https://github.com/btakita/tsift"
authors = ["Brian Takita <brian.takita@gmail.com>"]
readme = "README.md"
keywords = ["agent", "search", "rag", "cli", "context"]
categories = ["command-line-utilities", "development-tools"]
publish = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tsift-graph = { path = "../tsift-graph", version = "0.1.92" }
tsift-quality = { path = "../tsift-quality", version = "0.1.92" }
tsift-summarize = { path = "../tsift-summarize", version = "0.1.92" }

[dev-dependencies]
tempfile = "3"
