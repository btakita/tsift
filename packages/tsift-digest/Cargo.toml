[package]
name = "tsift-digest"
version = "0.1.62"
edition = "2024"
description = "Code-aware digest emitters for tsift — diff / log / metric / test digests with shared summary-cache enrichment"
license = "MIT"
repository = "https://github.com/btakita/tsift"
authors = ["Brian Takita <brian.takita@gmail.com>"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tsift-graph = { path = "../tsift-graph" }
tsift-quality = { path = "../tsift-quality" }
tsift-summarize = { path = "../tsift-summarize" }

[dev-dependencies]
tempfile = "3"
