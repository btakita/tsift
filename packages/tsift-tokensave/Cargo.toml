[package]
name = "tsift-tokensave"
version = "0.1.95"
edition = "2024"
description = "Tokensave DB reader adapter for tsift — schema mapping + FTS5 search"
license = "MIT"
repository = "https://github.com/btakita/tsift"
authors = ["Brian Takita <brian.takita@gmail.com>"]
readme = "README.md"
keywords = ["agent", "search", "rag", "cli", "context"]
categories = ["command-line-utilities", "development-tools"]
publish = true

[dependencies]
anyhow = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tsift-core = { path = "../tsift-core", version = "0.1.95" }

[dev-dependencies]
tempfile = "3"
