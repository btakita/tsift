[package]
name = "tsift-tokensave"
version = "0.1.0"
edition = "2024"
description = "Tokensave DB reader adapter for tsift — schema mapping + FTS5 search"
license = "MIT"
repository = "https://github.com/btakita/tsift"
authors = ["Brian Takita <brian.takita@gmail.com>"]

[dependencies]
anyhow = "1"
rusqlite = { version = "0.34", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tsift-core = { path = "../tsift-core" }

[dev-dependencies]
tempfile = "3"
