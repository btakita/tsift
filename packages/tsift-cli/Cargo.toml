[package]
name = "tsift-cli"
version = "0.1.62"
edition = "2024"
description = "CLI dispatch layer for tsift — clap types, command handlers, and output formatting"
license = "MIT"
repository = "https://github.com/btakita/tsift"
authors = ["Brian Takita <brian.takita@gmail.com>"]

[[bin]]
name = "tsift"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
blake3 = "1"
fs4 = "0.13"
ignore = "0.4"
rusqlite = { version = "0.34", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "3", features = ["json"] }
tagpath = { version = "0.11.1", default-features = false, features = ["lang-rust", "lang-python", "lang-javascript", "lang-typescript"] }
tree-sitter = "0.26"
tempfile = "3"
tsift = { path = "../.." }
tsift-core = { path = "../tsift-core" }
tsift-graph = { path = "../tsift-graph" }
tsift-resolution = { path = "../tsift-resolution" }
tsift-sqlite = { path = "../tsift-sqlite" }
tsift-algorithms = { path = "../tsift-algorithms" }
tsift-quality = { path = "../tsift-quality" }
tsift-index = { path = "../tsift-index" }
tsift-session = { path = "../tsift-session" }

[dev-dependencies]
fs4 = "0.13"
rusqlite = { version = "0.34", features = ["bundled"] }
tempfile = "3"
