[package]
name = "tsift-cli"
version = "0.1.91"
edition = "2024"
description = "CLI dispatch layer for tsift — clap types, command handlers, and output formatting"
license = "MIT"
repository = "https://github.com/btakita/tsift"
authors = ["Brian Takita <brian.takita@gmail.com>"]
readme = "README.md"
keywords = ["agent", "search", "rag", "cli", "context"]
categories = ["command-line-utilities", "development-tools"]
publish = true

[[bin]]
name = "tsift-cli"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
blake3 = "1"
fs4 = "0.13"
ignore = "0.4"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "3", features = ["json"] }
tagpath = { version = "0.11.1", default-features = false, features = ["lang-rust", "lang-python", "lang-javascript", "lang-typescript"] }
tree-sitter = "0.26"
tempfile = "3"
tsift-agent-doc = { path = "../tsift-agent-doc", version = "0.1.91" }
tsift-algorithms = { path = "../tsift-algorithms", version = "0.1.91" }
tsift-cache = { path = "../tsift-cache", version = "0.1.91" }
tsift-core = { path = "../tsift-core", version = "0.1.91" }
tsift-digest = { path = "../tsift-digest", version = "0.1.91" }
tsift-astgrep = { path = "../tsift-astgrep", version = "0.1.91", features = ["all-languages"] }
tsift-graph = { path = "../tsift-graph", version = "0.1.91" }
tsift-index = { path = "../tsift-index", version = "0.1.91" }
tsift-kg = { path = "../tsift-kg", version = "0.1.91" }
tsift-local-model = { path = "../tsift-local-model", version = "0.1.91" }
tsift-memory = { path = "../tsift-memory", version = "0.1.91" }
tsift-memgraphrag = { path = "../tsift-memgraphrag", version = "0.1.91" }
tsift-quality = { path = "../tsift-quality", version = "0.1.91" }
tsift-resolution = { path = "../tsift-resolution", version = "0.1.91" }
tsift-search = { path = "../tsift-search", version = "0.1.91" }
tsift-sqlite = { path = "../tsift-sqlite", version = "0.1.91" }
tsift-status = { path = "../tsift-status", version = "0.1.91" }
tsift-summarize = { path = "../tsift-summarize", version = "0.1.91" }
tsift-surrealdb = { path = "../tsift-surrealdb", version = "0.1.91", optional = true }
tsift-tokensave = { path = "../tsift-tokensave", version = "0.1.91" }

[features]
backend-surrealdb = ["dep:tsift-surrealdb"]

[dev-dependencies]
fs4 = "0.13"
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"
