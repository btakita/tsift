[package]
name = "tsift-quality"
version = "0.1.62"
edition = "2024"
description = "Quality-gate surfaces for tsift — audit, perf gates, DCI benchmarks, runtime churn detection, cycle packet cache"
license = "MIT"
repository = "https://github.com/btakita/tsift"
authors = ["Brian Takita <brian.takita@gmail.com>"]
readme = "README.md"
keywords = ["agent", "search", "rag", "cli", "context"]
categories = ["command-line-utilities", "development-tools"]
publish = true

[dependencies]
anyhow = "1"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tsift-index = { path = "../tsift-index", version = "0.1.62" }

[dev-dependencies]
filetime = "0.2"
rusqlite = { version = "0.34", features = ["bundled"] }
tempfile = "3"
