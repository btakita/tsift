[package]
name = "tsift-quality"
version = "0.1.0"
edition = "2024"
description = "Quality-gate surfaces for tsift — audit, perf gates, DCI benchmarks, runtime churn detection"
license = "MIT"
repository = "https://github.com/btakita/tsift"
authors = ["Brian Takita <brian.takita@gmail.com>"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
