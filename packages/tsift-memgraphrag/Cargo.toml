[package]
name = "tsift-memgraphrag"
version = "0.1.86"
edition = "2024"
description = "MemGraphRAG graph projection and retrieval layer for tsift"
license = "MIT"
repository = "https://github.com/btakita/tsift"
authors = ["Brian Takita <brian.takita@gmail.com>"]
readme = "README.md"
keywords = ["agent", "memory", "rag", "graph", "context"]
categories = ["command-line-utilities", "development-tools"]
publish = true

[dependencies]
anyhow = "1"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tsift-core = { path = "../tsift-core", version = "0.1.86" }
tsift-kg = { path = "../tsift-kg", version = "0.1.86" }
tsift-local-model = { path = "../tsift-local-model", version = "0.1.86" }
tsift-memory = { path = "../tsift-memory", version = "0.1.86" }
tsift-sqlite = { path = "../tsift-sqlite", version = "0.1.86" }

[dev-dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"
