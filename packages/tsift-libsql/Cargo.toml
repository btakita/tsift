[package]
name = "tsift-libsql"
version = "0.1.95"
edition = "2024"
description = "libSQL graph store backend for tsift"
license = "MIT"
repository = "https://github.com/btakita/tsift"
authors = ["Brian Takita <brian.takita@gmail.com>"]
readme = "README.md"
keywords = ["agent", "search", "rag", "cli", "context"]
categories = ["command-line-utilities", "development-tools"]
publish = true

[dependencies]
anyhow = "1"
blake3 = "1"
libsql = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
tsift-core = { path = "../tsift-core", version = "0.1.95" }
tempfile = "3"
