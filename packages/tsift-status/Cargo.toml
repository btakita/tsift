[package]
name = "tsift-status"
version = "0.1.62"
edition = "2024"
description = "Session health + lock diagnostics for tsift — index freshness, instruction version, summary-cache and lock-sidecar status"
license = "MIT"
repository = "https://github.com/btakita/tsift"
authors = ["Brian Takita <brian.takita@gmail.com>"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.34", features = ["bundled"] }
tsift-index = { path = "../tsift-index" }
tsift-sqlite = { path = "../tsift-sqlite" }
tsift-summarize = { path = "../tsift-summarize" }

[dev-dependencies]
tempfile = "3"
fs4 = "0.13"
