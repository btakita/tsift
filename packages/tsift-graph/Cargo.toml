[package]
name = "tsift-graph"
version = "0.1.104"
edition = "2024"
description = "Language-aware graph extraction — call sites, routes, community detection, and path finding for tsift"
license = "MIT"
repository = "https://github.com/btakita/tsift"
authors = ["Brian Takita <brian.takita@gmail.com>"]
readme = "README.md"
keywords = ["agent", "search", "rag", "cli", "context"]
categories = ["command-line-utilities", "development-tools"]
publish = true

[dependencies]
anyhow = "1"
blake3 = "1"
lazily = "0.49.0"
serde = { version = "1", features = ["derive"] }
tsift-core = { path = "../tsift-core", version = "0.1.104" }
tsift-md-ast = { path = "../tsift-md-ast", version = "0.1.104", optional = true }
tree-sitter = "0.26"

tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-kotlin-ng = { version = "1", optional = true }
tree-sitter-zig = { version = "1", optional = true }
tree-sitter-bash = { version = "0.25", optional = true }
tree-sitter-gdscript = { version = "6", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-c-sharp = { version = "0.23", optional = true }
tree-sitter-c = { version = "0.24", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-odin = { version = "1.3", optional = true }
tree-sitter-luau = { version = "1.2", optional = true }
# Jai has no grammar on crates.io; `tsift-tree-sitter-jai` packages
# constantitus/tree-sitter-jai (MIT-0) under the standard grammar-crate API.
# Renamed to `tree-sitter-jai` so an upstream crate is a one-line swap.
tree-sitter-jai = { package = "tsift-tree-sitter-jai", path = "../tsift-tree-sitter-jai", version = "0.1.104", optional = true }
tree-sitter-json = { version = "0.24", optional = true }
tree-sitter-yaml = { version = "0.7", optional = true }
serde_json = { version = "1", optional = true }
tree-sitter-xml = { version = "0.7", optional = true }

[features]
default = ["lang-rust", "lang-python", "lang-typescript", "lang-javascript", "lang-kotlin", "lang-zig", "lang-bash", "lang-go", "lang-csharp", "lang-c", "lang-cpp", "lang-odin", "lang-luau", "lang-gdscript", "lang-markdown", "lang-json", "lang-yaml", "lang-xsd", "lang-wsdl"]
lang-rust = ["dep:tree-sitter-rust"]
lang-python = ["dep:tree-sitter-python"]
lang-typescript = ["dep:tree-sitter-typescript"]
lang-javascript = ["dep:tree-sitter-javascript"]
lang-kotlin = ["dep:tree-sitter-kotlin-ng"]
lang-zig = ["dep:tree-sitter-zig"]
lang-bash = ["dep:tree-sitter-bash"]
lang-gdscript = ["dep:tree-sitter-gdscript"]
lang-go = ["dep:tree-sitter-go"]
lang-csharp = ["dep:tree-sitter-c-sharp"]
lang-c = ["dep:tree-sitter-c"]
lang-cpp = ["dep:tree-sitter-cpp"]
lang-odin = ["dep:tree-sitter-odin"]
lang-luau = ["dep:tree-sitter-luau"]
# Opt-in (not in `default`): the Jai grammar is a 29 MB generated parser.c.
lang-jai = ["dep:tree-sitter-jai"]
lang-markdown = ["dep:tsift-md-ast"]
lang-json = ["dep:tree-sitter-json", "dep:serde_json"]
lang-yaml = ["dep:tree-sitter-yaml", "dep:serde_json"]
lang-xsd = ["dep:tree-sitter-xml"]
# A WSDL embeds XML Schema under <types>, projected by the XSD dialect.
lang-wsdl = ["lang-xsd"]
all-languages = ["lang-rust", "lang-python", "lang-typescript", "lang-javascript", "lang-kotlin", "lang-zig", "lang-bash", "lang-go", "lang-csharp", "lang-c", "lang-cpp", "lang-odin", "lang-jai", "lang-luau", "lang-gdscript", "lang-markdown", "lang-json", "lang-yaml", "lang-xsd", "lang-wsdl"]
