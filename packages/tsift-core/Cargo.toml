[package]
name = "tsift-core"
version = "0.1.76"
edition = "2024"
description = "Provider-neutral graph types and GraphStore trait for tsift"
license = "MIT"
repository = "https://github.com/btakita/tsift"
authors = ["Brian Takita <brian.takita@gmail.com>"]
readme = "README.md"
keywords = ["agent", "search", "rag", "cli", "context"]
categories = ["command-line-utilities", "development-tools"]
publish = true

[dependencies]
anyhow = "1"
blake3 = "1"
lazily = "0.32.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
