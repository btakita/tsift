[package]
name = "tsift-sim-world"
version = "0.1.62"
edition = "2024"
description = "Deterministic SimWorld test harness for tsift — seeded corpus + named-edge traces over the session/rewrite/status surfaces"
license = "MIT"
repository = "https://github.com/btakita/tsift"
authors = ["Brian Takita <brian.takita@gmail.com>"]

[dependencies]

[dev-dependencies]
tempfile = "3"
tsift = { path = "../.." }
tsift-cli = { path = "../tsift-cli" }
# test-support exposes session_digest::extract_prompt_targets_from_text_block as pub.
tsift-session = { path = "../tsift-session", features = ["test-support"] }
