[package]
name = "tsift-sim-world"
version = "0.1.91"
edition = "2024"
description = "Deterministic SimWorld test harness for tsift — seeded corpus + named-edge traces over the session/rewrite/status surfaces"
license = "MIT"
repository = "https://github.com/btakita/tsift"
authors = ["Brian Takita <brian.takita@gmail.com>"]
readme = "README.md"
keywords = ["agent", "search", "rag", "cli", "context"]
categories = ["command-line-utilities", "development-tools"]
publish = true

[dependencies]

[dev-dependencies]
tempfile = "3"
tsift = { path = "../..", version = "0.1.91" }
tsift-cli = { path = "../tsift-cli", version = "0.1.91" }
# test-support exposes session_digest::extract_prompt_targets_from_text_block as pub.
tsift-session = { path = "../tsift-session", version = "0.1.91", features = ["test-support"] }
