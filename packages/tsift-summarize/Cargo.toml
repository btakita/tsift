[package]
name = "tsift-summarize"
version = "0.1.90"
edition = "2024"
description = "Tsift cached LLM analysis — pre-computed summaries, entities, relationships, and snapshot-fallback reader"
license = "MIT"
repository = "https://github.com/btakita/tsift"
authors = ["Brian Takita <brian.takita@gmail.com>"]
readme = "README.md"
keywords = ["agent", "search", "rag", "cli", "context"]
categories = ["command-line-utilities", "development-tools"]
publish = true

[dependencies]
anyhow = "1"
blake3 = "1"
fs4 = "0.13"
lazily = "0.49.0"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
tsift-index = { path = "../tsift-index", version = "0.1.90" }
tsift-sqlite = { path = "../tsift-sqlite", version = "0.1.90" }

[dev-dependencies]
tempfile = "3"
