[package]
name = "tsift-summarize"
version = "0.1.62"
edition = "2024"
description = "Tsift cached LLM analysis — pre-computed summaries, entities, relationships, and snapshot-fallback reader"
license = "MIT"
repository = "https://github.com/btakita/tsift"
authors = ["Brian Takita <brian.takita@gmail.com>"]

[dependencies]
anyhow = "1"
blake3 = "1"
fs4 = "0.13"
rusqlite = { version = "0.34", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
tsift-index = { path = "../tsift-index" }
tsift-sqlite = { path = "../tsift-sqlite" }

[dev-dependencies]
tempfile = "3"
