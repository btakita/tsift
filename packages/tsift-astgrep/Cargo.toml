[package]
name = "tsift-astgrep"
version = "0.1.90"
edition = "2024"
description = "Structural (ast-grep) code search and rewrite engine for tsift"
license = "MIT"
repository = "https://github.com/btakita/tsift"
authors = ["Brian Takita <brian.takita@gmail.com>"]
keywords = ["ast", "search", "refactor", "codemod", "tsift"]
categories = ["development-tools"]
publish = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }

ast-grep-core = "0.44"
ast-grep-language = { version = "0.44", default-features = false }
ignore = "0.4"

[features]
# Mirrors the tsift `lang-*` feature fan-out. `ast-grep-language` gates each
# grammar independently, so an unlisted language is simply not resolvable
# rather than a link-time cost.
default = []
lang-rust = ["ast-grep-language/tree-sitter-rust"]
lang-python = ["ast-grep-language/tree-sitter-python"]
lang-typescript = ["ast-grep-language/tree-sitter-typescript"]
lang-javascript = ["ast-grep-language/tree-sitter-javascript"]
lang-kotlin = ["ast-grep-language/tree-sitter-kotlin"]
lang-bash = ["ast-grep-language/tree-sitter-bash"]
lang-markdown = ["ast-grep-language/tree-sitter-md"]
# `lang-zig` and `lang-gdscript` exist in tsift but ast-grep-language ships no
# Zig or GDScript grammar, so these tsift features intentionally forward
# nothing here.
lang-zig = []
lang-gdscript = []
# Structural-only languages: ast-grep can match and rewrite these, but
# `tsift-graph`/`tsift-search` have no tag queries for them, so they are not
# indexable and have no semantic-edit executor. See specs/structural-patterns.md.
lang-c = ["ast-grep-language/tree-sitter-c"]
lang-cpp = ["ast-grep-language/tree-sitter-cpp"]
lang-csharp = ["ast-grep-language/tree-sitter-c-sharp"]
lang-css = ["ast-grep-language/tree-sitter-css"]
lang-dart = ["ast-grep-language/tree-sitter-dart"]
lang-elixir = ["ast-grep-language/tree-sitter-elixir"]
lang-go = ["ast-grep-language/tree-sitter-go"]
lang-haskell = ["ast-grep-language/tree-sitter-haskell"]
lang-hcl = ["ast-grep-language/tree-sitter-hcl"]
lang-html = ["ast-grep-language/tree-sitter-html"]
lang-java = ["ast-grep-language/tree-sitter-java"]
lang-json = ["ast-grep-language/tree-sitter-json"]
lang-lua = ["ast-grep-language/tree-sitter-lua"]
lang-nix = ["ast-grep-language/tree-sitter-nix"]
lang-php = ["ast-grep-language/tree-sitter-php"]
lang-ruby = ["ast-grep-language/tree-sitter-ruby"]
lang-scala = ["ast-grep-language/tree-sitter-scala"]
lang-solidity = ["ast-grep-language/tree-sitter-solidity"]
lang-swift = ["ast-grep-language/tree-sitter-swift"]
lang-yaml = ["ast-grep-language/tree-sitter-yaml"]
all-languages = [
    "lang-rust",
    "lang-python",
    "lang-typescript",
    "lang-javascript",
    "lang-kotlin",
    "lang-bash",
    "lang-markdown",
    "lang-c",
    "lang-cpp",
    "lang-csharp",
    "lang-css",
    "lang-dart",
    "lang-elixir",
    "lang-go",
    "lang-haskell",
    "lang-hcl",
    "lang-html",
    "lang-java",
    "lang-json",
    "lang-lua",
    "lang-nix",
    "lang-php",
    "lang-ruby",
    "lang-scala",
    "lang-solidity",
    "lang-swift",
    "lang-yaml",
]

[dev-dependencies]
tempfile = "3"
# Only the parser handle, to prove `tree_sitter_language()` yields a grammar a
# `tree_sitter::Parser` actually accepts — the same thing external reparse
# callers do with it.
tree-sitter = "0.26"
