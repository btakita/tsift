[package]
name = "tsift-index"
version = "0.1.78"
edition = "2024"
description = "Tsift index foundation — config loading, project walk, init/instructions, AST symbol index"
license = "MIT"
repository = "https://github.com/btakita/tsift"
authors = ["Brian Takita <brian.takita@gmail.com>"]
readme = "README.md"
keywords = ["agent", "search", "rag", "cli", "context"]
categories = ["command-line-utilities", "development-tools"]
publish = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rusqlite = { version = "0.40", features = ["bundled"] }
fs4 = "0.13"
ignore = "0.4"
lazily = "0.49.0"
tagpath = { version = "0.11.1", default-features = false, features = ["lang-rust", "lang-python", "lang-javascript", "lang-typescript"] }
tsift-graph = { path = "../tsift-graph", version = "0.1.78" }
tsift-sqlite = { path = "../tsift-sqlite", version = "0.1.78" }

[dev-dependencies]
tempfile = "3"
