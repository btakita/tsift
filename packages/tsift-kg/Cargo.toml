[package]
name = "tsift-kg"
version = "0.1.85"
edition = "2024"
description = "Shared local Knowledge Graph extraction pipeline for tsift and agent-doc"
license = "MIT"
repository = "https://github.com/btakita/tsift"
authors = ["Brian Takita <brian.takita@gmail.com>"]
readme = "README.md"
keywords = ["agent", "search", "rag", "graph", "context"]
categories = ["command-line-utilities", "development-tools"]
publish = true

[dependencies]
anyhow = "1"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tsift-core = { path = "../tsift-core", version = "0.1.85" }
tsift-local-model = { path = "../tsift-local-model", version = "0.1.85" }
tsift-sqlite = { path = "../tsift-sqlite", version = "0.1.85" }
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"
