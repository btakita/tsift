[package]
name = "tsift-search"
version = "0.1.102"
edition = "2024"
description = "Search + impact surfaces for tsift — lexical search adapter, impact analysis, and tagpath annotation"
license = "MIT"
repository = "https://github.com/btakita/tsift"
authors = ["Brian Takita <brian.takita@gmail.com>"]
readme = "README.md"
keywords = ["agent", "search", "rag", "cli", "context"]
categories = ["command-line-utilities", "development-tools"]
publish = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"
tagpath = { version = "0.11.1", default-features = false, features = ["lang-rust", "lang-python", "lang-javascript", "lang-typescript"] }
tsift-digest = { path = "../tsift-digest", version = "0.1.102" }
tsift-graph = { path = "../tsift-graph", version = "0.1.102" }
tsift-index = { path = "../tsift-index", version = "0.1.102" }
tsift-quality = { path = "../tsift-quality", version = "0.1.102" }
tsift-summarize = { path = "../tsift-summarize", version = "0.1.102" }

[features]
# Language features gate the per-Lang match arms in `impact::is_import_line`
# and forward to tsift-graph so the matching tree-sitter grammars + Lang
# variants are available. Mirrors root tsift's language feature set.
default = ["lang-rust", "lang-python", "lang-typescript", "lang-javascript", "lang-kotlin", "lang-zig", "lang-bash", "lang-go", "lang-csharp", "lang-c", "lang-cpp", "lang-odin", "lang-jai", "lang-gdscript", "lang-markdown", "lang-json", "lang-yaml", "lang-xsd", "lang-wsdl"]
lang-rust = ["tsift-graph/lang-rust"]
lang-python = ["tsift-graph/lang-python"]
lang-typescript = ["tsift-graph/lang-typescript"]
lang-javascript = ["tsift-graph/lang-javascript"]
lang-kotlin = ["tsift-graph/lang-kotlin"]
lang-zig = ["tsift-graph/lang-zig"]
lang-bash = ["tsift-graph/lang-bash"]
lang-gdscript = ["tsift-graph/lang-gdscript"]
lang-go = ["tsift-graph/lang-go"]
lang-csharp = ["tsift-graph/lang-csharp"]
lang-c = ["tsift-graph/lang-c"]
lang-cpp = ["tsift-graph/lang-cpp"]
lang-odin = ["tsift-graph/lang-odin"]
lang-jai = ["tsift-graph/lang-jai"]
lang-markdown = ["tsift-graph/lang-markdown"]
lang-json = ["tsift-graph/lang-json"]
lang-yaml = ["tsift-graph/lang-yaml"]
lang-xsd = ["tsift-graph/lang-xsd"]
lang-wsdl = ["tsift-graph/lang-wsdl"]
all-languages = ["lang-rust", "lang-python", "lang-typescript", "lang-javascript", "lang-kotlin", "lang-zig", "lang-bash", "lang-go", "lang-csharp", "lang-c", "lang-cpp", "lang-odin", "lang-jai", "lang-gdscript", "lang-markdown", "lang-json", "lang-yaml", "lang-xsd", "lang-wsdl"]

[dev-dependencies]
tempfile = "3"
