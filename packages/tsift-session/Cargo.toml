[package]
name = "tsift-session"
version = "0.1.62"
edition = "2024"
description = "Session observability for tsift — session cost / digest / review across Claude, Codex, and agent-doc transcripts"
license = "MIT"
repository = "https://github.com/btakita/tsift"
authors = ["Brian Takita <brian.takita@gmail.com>"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tsift-quality = { path = "../tsift-quality" }

[dev-dependencies]
tempfile = "3"
