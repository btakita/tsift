[package]
name = "tsift-session"
version = "0.1.87"
edition = "2024"
description = "Session observability for tsift — session cost / digest / review across Claude, Codex, and agent-doc transcripts"
license = "MIT"
repository = "https://github.com/btakita/tsift"
authors = ["Brian Takita <brian.takita@gmail.com>"]
readme = "README.md"
keywords = ["agent", "search", "rag", "cli", "context"]
categories = ["command-line-utilities", "development-tools"]
publish = true

[dependencies]
tsift-agent-doc = { path = "../tsift-agent-doc", version = "0.1.87" }

[features]
# Re-exports otherwise test-only digest helpers (e.g.
# `session_digest::extract_prompt_targets_from_text_block`) as `pub` so the
# `tsift-sim-world` harness crate can drive them as a dev-dependency.
test-support = ["tsift-agent-doc/test-support"]
